<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="pageTitle">Archivage - Trust Handling Company</title>
    <style>
        :root {
            --primary-red: #d32f2f;
            --primary-blue: #1976d2;
            --primary-orange: #f57c00;
            --dark-bg: #2c3e50;
            --light-bg: #f8f9fa;
            --accent-color: #34495e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .lang-select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
            background-color: var(--dark-bg);
            padding: 15px;
            border-radius: 10px;
        }
        .logo-container img {
            max-height: 70px;
            width: auto;
            display: block;
            margin: 0 auto;
        }
        h1 {
            color: var(--dark-bg);
            text-align: center;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .management-section {
            background: #eee;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
        }
        h2 { font-size: 16px; margin-top: 0; color: #444; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        input[type="text"], input[type="date"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        
        .search-box-container {
            margin-bottom: 15px;
        }
        .search-input-styled {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--primary-blue) !important;
            border-radius: 8px;
            font-size: 15px;
            background-color: #f0f7ff;
            box-sizing: border-box;
            outline: none;
            transition: background 0.3s, border-color 0.3s;
        }
        .search-input-styled:focus {
            background-color: #fff;
            border-color: #0d47a1 !important;
            box-shadow: 0 0 5px rgba(25, 118, 210, 0.3);
        }

        .drop-zone {
            border: 2px dashed #1976d2;
            border-radius: 8px;
            background: #f0f7ff;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
        }
        .drop-zone.dragover {
            background: #e1f5fe;
            border-color: #0d47a1;
        }
        .drop-zone-text {
            color: #555;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .drop-zone input[type="file"] {
            display: none;
        }
        .file-info-display {
            margin-top: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #1976d2;
        }

        button {
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: background 0.3s;
        }
        .btn-primary { background-color: var(--primary-blue); }
        .btn-primary:hover { background-color: #0d47a1; }
        .btn-primary:disabled { background-color: #90caf9; cursor: not-allowed; }
        
        .btn-secondary { background-color: var(--accent-color); }
        .btn-secondary:hover { background-color: #2c3e50; }

        .btn-cancel-edit {
            background-color: #7f8c8d;
            margin-top: 10px;
            display: none;
        }
        .btn-cancel-edit:hover { background-color: #7f8c8d; }

        .flex-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .flex-col { flex: 1; min-width: 200px; }

        @media(min-width: 600px) {
            body { padding: 20px; }
            .container { padding: 30px; }
            h1 { font-size: 24px; }
            h2 { font-size: 18px; }
        }
        
        .archives-container {
            margin-top: 25px;
            display: block;
        }
        .archive-card {
            background: #fff;
            border: 1px solid #ddd;
            border-left: 5px solid var(--primary-blue);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .archive-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .archive-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--dark-bg);
        }
        .archive-folder {
            font-family: monospace;
            background: #e3f2fd;
            color: var(--primary-blue);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
        .archive-details {
            font-size: 13px;
            color: #555;
            margin-bottom: 10px;
        }
        .file-badge {
            display: inline-block;
            background: #f1f2f6;
            color: #2f3640;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-right: 5px;
            border: 1px solid #dcdde1;
        }
        .file-link {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: bold;
            margin-left: 5px;
        }
        .file-link:hover { text-decoration: underline; }

        .archive-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            border-top: 1px solid #eee;
            padding-top: 8px;
        }
        .btn-edit {
            background-color: var(--primary-orange);
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-edit:hover { background-color: #e65100; }

        .btn-delete {
            background-color: var(--primary-red);
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-delete:hover { background-color: #b71c1c; }
        .no-archive {
            text-align: center;
            color: #777;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <span></span>
        <select id="langSelector" class="lang-select" onchange="changeLanguage()">
            <option value="fr">🇫🇷 Français</option>
            <option value="en">🇬🇧 English</option>
        </select>
    </div>

    <div class="logo-container">
        <img src="https://i.postimg.cc/yxxj5h9m/THC.png" alt="Logo Trust Handling Company">
    </div>

    <h1 id="mainTitle">Système d'Archivage - THC</h1>

    <div class="management-section">
        <h2 id="subFolderSectionTitle">⚙️ Créer un sous-dossier</h2>
        <div class="flex-row">
            <div class="flex-col">
                <label id="lblParentFolder" for="parentFolderSelect">Dossier Principal cible</label>
                <select id="parentFolderSelect"></select>
            </div>
            <div class="flex-col">
                <label id="lblSubFolderName" for="newSubFolderName">Nom du nouveau sous-dossier</label>
                <input type="text" id="newSubFolderName" placeholder="Ex: Janvier 2026, Factures...">
            </div>
        </div>
        <button id="btnAddSubFolder" onclick="addSubFolder()" class="btn-secondary" style="margin-top: 15px;">Ajouter le sous-dossier</button>
    </div>

    <div class="form-group">
        <label id="lblDocTitle" for="docTitle">Titre du document</label>
        <input type="text" id="docTitle" placeholder="Ex: Rapport mensuel">
    </div>

    <div class="form-group">
        <label id="lblFinalFolder" for="finalFolderSelect">Emplacement de destination (Dossier ou Sous-dossier)</label>
        <select id="finalFolderSelect"></select>
    </div>

    <div class="form-group">
        <label id="lblDocDate" for="docDate">Date</label>
        <input type="date" id="docDate">
    </div>

    <div class="form-group">
        <label id="lblDocFile" for="docFile">Document (Glissez-déposez ou cliquez)</label>
        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-text" id="dropZoneText">📁 Glissez et déposez votre fichier ici, ou cliquez pour parcourir</div>
            <input type="file" id="docFile" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation">
            <div class="file-info-display" id="fileInfoDisplay"></div>
        </div>
    </div>

    <div class="form-group">
        <label id="lblDocDesc" for="docDesc">Description / Mots-clés</label>
        <textarea id="docDesc" rows="2" placeholder="Détails optionnels..."></textarea>
    </div>

    <button id="btnSubmitDoc" onclick="saveDocument()" class="btn-primary">Enregistrer dans les archives</button>
    <button id="btnCancelEdit" onclick="cancelEdit()" class="btn-cancel-edit">Annuler la modification</button>

    <div class="archives-container">
        <h2 id="listArchivesTitle">📂 Liste des fichiers archivés</h2>
        
        <div class="search-box-container">
            <input type="text" id="searchInput" class="search-input-styled" oninput="filterArchives()" placeholder="🔍 Rechercher par titre, dossier, type, nom de fichier ou description...">
        </div>

        <div id="archivesList">
            <div class="no-archive" id="loadingText">Chargement des archives depuis le cloud...</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDTfE06jD2NUS7-l5ynx0Iy-kFtg-8IzPw",
        authDomain: "thc-archivage.firebaseapp.com",
        projectId: "thc-archivage",
        storageBucket: "thc-archivage.firebasestorage.app",
        messagingSenderId: "630363860954",
        appId: "1:630363860954:web:953c7a0e15bfa53b469ae3",
        measurementId: "G-9MDJ6J0CK3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const translations = {
        fr: {
            pageTitle: "Archivage - Trust Handling Company",
            mainTitle: "Système d'Archivage - THC",
            subFolderSectionTitle: "⚙️ Créer un sous-dossier",
            lblParentFolder: "Dossier Principal cible",
            lblSubFolderName: "Nom du nouveau sous-dossier",
            subFolderPlaceholder: "Ex: Janvier 2026, Factures...",
            btnAddSubFolder: "Ajouter le sous-dossier",
            lblDocTitle: "Titre du document",
            docTitlePlaceholder: "Ex: Rapport mensuel",
            lblFinalFolder: "Emplacement de destination (Dossier ou Sous-dossier)",
            lblDocDate: "Date",
            lblDocFile: "Document (Word, Excel, PDF, Image...)",
            dropZoneText: "📁 Glissez et déposez votre fichier ici, ou cliquez pour parcourir",
            lblDocDesc: "Description / Mots-clés",
            docDescPlaceholder: "Détails optionnels...",
            btnSubmitDoc: "Enregistrer dans les archives",
            btnUpdateDoc: "Mettre à jour l'archive",
            btnCancelEdit: "Annuler la modification",
            listArchivesTitle: "📂 Liste des fichiers archivés",
            searchPlaceholder: "🔍 Rechercher par titre, dossier, type, nom de fichier ou description...",
            loadingText: "Chargement des archives depuis le cloud...",
            emptyText: "Aucune archive pour le moment.",
            noSearchResult: "Aucun résultat trouvé pour votre recherche.",
            subFolderSuccess: "Sous-dossier créé avec succès !",
            subFolderExists: "Ce sous-dossier existe déjà.",
            subFolderAlert: "Veuillez entrer un nom pour le sous-dossier.",
            docTitleAlert: "Veuillez entrer un titre de document.",
            docSuccessAlert: "Archive enregistrée avec succès !",
            docUpdateAlert: "Archive mise à jour avec succès !",
            docErrorAlert: "Erreur lors de l'enregistrement.",
            uploadingText: "⏳ Upload du fichier en cours...",
            noFile: "Aucun fichier",
            downloadFile: "📥 Télécharger",
            editBtn: "✏️ Modifier",
            deleteBtn: "🗑️ Supprimer",
            confirmDelete: "Voulez-vous vraiment supprimer cette archive ?"
        },
        en: {
            pageTitle: "Archiving - Trust Handling Company",
            mainTitle: "Archiving System - THC",
            subFolderSectionTitle: "⚙️ Create a Sub-folder",
            lblParentFolder: "Target Main Folder",
            lblSubFolderName: "New Sub-folder Name",
            subFolderPlaceholder: "Ex: January 2026, Invoices...",
            btnAddSubFolder: "Add Sub-folder",
            lblDocTitle: "Document Title",
            docTitlePlaceholder: "Ex: Monthly report",
            lblFinalFolder: "Destination Location (Folder or Sub-folder)",
            lblDocDate: "Date",
            lblDocFile: "Document (Word, Excel, PDF, Image...)",
            dropZoneText: "📁 Drag and drop your file here, or click to browse",
            lblDocDesc: "Description / Keywords",
            docDescPlaceholder: "Optional details...",
            btnSubmitDoc: "Save to Archives",
            btnUpdateDoc: "Update Archive",
            btnCancelEdit: "Cancel Editing",
            listArchivesTitle: "📂 List of Archived Files",
            searchPlaceholder: "🔍 Search by title, folder, file type, file name or description...",
            loadingText: "Loading archives from the cloud...",
            emptyText: "No archives yet.",
            noSearchResult: "No results found for your search.",
            subFolderSuccess: "Sub-folder created successfully!",
            subFolderExists: "This sub-folder already exists.",
            subFolderAlert: "Please enter a name for the sub-folder.",
            docTitleAlert: "Please enter a document title.",
            docSuccessAlert: "Archive successfully saved!",
            docUpdateAlert: "Archive successfully updated!",
            docErrorAlert: "Error while saving.",
            uploadingText: "⏳ Uploading file...",
            noFile: "No file",
            downloadFile: "📥 Download",
            editBtn: "✏️ Edit",
            deleteBtn: "🗑️ Delete",
            confirmDelete: "Are you sure you want to delete this archive?"
        }
    };

    let currentLang = 'fr';
    let selectedFileObject = null;
    let editingDocId = null;
    let allArchivesData = [];

    function formatFileSize(bytes) {
        if (!bytes || bytes === 0) return '';
        const k = 1024;
        const sizes = ['octets', 'Ko', 'Mo', 'Go'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function getFileTypeCategory(filename) {
        if (!filename) return "Autre";
        const ext = filename.split('.').pop().toLowerCase();
        
        if (['pdf'].includes(ext)) return "PDF";
        if (['doc', 'docx'].includes(ext)) return "Word";
        if (['xls', 'xlsx', 'csv'].includes(ext)) return "Excel";
        if (['ppt', 'pptx'].includes(ext)) return "PowerPoint";
        if (['jpg', 'jpeg'].includes(ext)) return "JPEG";
        if (['png'].includes(ext)) return "PNG";
        if (['gif', 'webp', 'svg'].includes(ext)) return "Image";
        if (['txt'].includes(ext)) return "Texte";
        if (['zip', 'rar', '7z'].includes(ext)) return "Archive (ZIP)";
        return ext.toUpperCase();
    }

    window.changeLanguage = function() {
        currentLang = document.getElementById('langSelector').value;
        const t = translations[currentLang];

        document.getElementById('pageTitle').textContent = t.pageTitle;
        document.getElementById('mainTitle').textContent = t.mainTitle;
        document.getElementById('subFolderSectionTitle').textContent = t.subFolderSectionTitle;
        document.getElementById('lblParentFolder').textContent = t.lblParentFolder;
        document.getElementById('lblSubFolderName').textContent = t.lblSubFolderName;
        document.getElementById('newSubFolderName').placeholder = t.subFolderPlaceholder;
        document.getElementById('btnAddSubFolder').textContent = t.btnAddSubFolder;
        document.getElementById('lblDocTitle').textContent = t.lblDocTitle;
        document.getElementById('docTitle').placeholder = t.docTitlePlaceholder;
        document.getElementById('lblFinalFolder').textContent = t.lblFinalFolder;
        document.getElementById('lblDocDate').textContent = t.lblDocDate;
        document.getElementById('lblDocFile').textContent = t.lblDocFile;
        document.getElementById('dropZoneText').textContent = t.dropZoneText;
        document.getElementById('lblDocDesc').textContent = t.lblDocDesc;
        document.getElementById('docDesc').placeholder = t.docDescPlaceholder;
        document.getElementById('btnCancelEdit').textContent = t.btnCancelEdit;
        document.getElementById('listArchivesTitle').textContent = t.listArchivesTitle;
        document.getElementById('searchInput').placeholder = t.searchPlaceholder;
        
        const submitBtn = document.getElementById('btnSubmitDoc');
        if (!submitBtn.disabled) {
            submitBtn.textContent = editingDocId ? t.btnUpdateDoc : t.btnSubmitDoc;
        }

        renderArchives(allArchivesData);
    }

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('docFile');
    const fileInfoDisplay = document.getElementById('fileInfoDisplay');

    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            selectedFileObject = e.target.files[0];
            const sizeStr = formatFileSize(selectedFileObject.size);
            const typeStr = getFileTypeCategory(selectedFileObject.name);
            fileInfoDisplay.textContent = `📎 [${typeStr}] ${selectedFileObject.name} (${sizeStr})`;
        }
    });

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            selectedFileObject = e.dataTransfer.files[0];
            const sizeStr = formatFileSize(selectedFileObject.size);
            const typeStr = getFileTypeCategory(selectedFileObject.name);
            fileInfoDisplay.textContent = `📎 [${typeStr}] ${selectedFileObject.name} (${sizeStr})`;
        }
    });

    let folderStructure = {
        "Administration": [],
        "Comptabilité": [],
        "Audits": [],
        "Contrats": [],
        "Rapport": [],
        "Facture": []
    };

    window.updateAllSelects = function() {
        const parentSelect = document.getElementById('parentFolderSelect');
        const finalSelect = document.getElementById('finalFolderSelect');
        
        if(!parentSelect || !finalSelect) return;

        const currentParent = parentSelect.value;
        const currentFinal = finalSelect.value;

        parentSelect.innerHTML = '';
        finalSelect.innerHTML = '';

        for (const mainFolder in folderStructure) {
            const parentOption = document.createElement('option');
            parentOption.value = mainFolder;
            parentOption.textContent = mainFolder;
            parentSelect.appendChild(parentOption);

            const mainOptionFinal = document.createElement('option');
            mainOptionFinal.value = mainFolder;
            mainOptionFinal.textContent = `📁 ${mainFolder}`;
            finalSelect.appendChild(mainOptionFinal);

            if(folderStructure[mainFolder]) {
                folderStructure[mainFolder].forEach(subFolder => {
                    const subOption = document.createElement('option');
                    subOption.value = `${mainFolder} / ${subFolder}`;
                    subOption.textContent = `   └─ ${subFolder}`;
                    finalSelect.appendChild(subOption);
                });
            }
        }

        if(currentParent) parentSelect.value = currentParent;
        if(currentFinal) finalSelect.value = currentFinal;
    }

    window.addSubFolder = function() {
        const t = translations[currentLang];
        const parent = document.getElementById('parentFolderSelect').value;
        const subName = document.getElementById('newSubFolderName').value.trim();

        if(!subName) {
            alert(t.subFolderAlert);
            return;
        }

        if(!folderStructure[parent].includes(subName)) {
            folderStructure[parent].push(subName);
            document.getElementById('newSubFolderName').value = '';
            window.updateAllSelects();
            alert(t.subFolderSuccess);
        } else {
            alert(t.subFolderExists);
        }
    }

    window.saveDocument = async function() {
        const t = translations[currentLang];
        const title = document.getElementById('docTitle').value;
        const finalFolder = document.getElementById('finalFolderSelect').value;
        const date = document.getElementById('docDate').value;
        const desc = document.getElementById('docDesc').value;
        const submitBtn = document.getElementById('btnSubmitDoc');

        if(!title) {
            alert(t.docTitleAlert);
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = t.uploadingText;

        try {
            let fileUrl = '';
            let fileName = '';
            let fileSize = '';
            let fileType = '';

            // Si un nouveau fichier est sélectionné, on l'uploade sur Firebase Storage
            if (selectedFileObject) {
                const storageRef = ref(storage, 'archives/' + Date.now() + '_' + selectedFileObject.name);
                const snapshot = await uploadBytes(storageRef, selectedFileObject);
                fileUrl = await getDownloadURL(snapshot.ref);
                
                fileName = selectedFileObject.name;
                fileSize = formatFileSize(selectedFileObject.size);
                fileType = getFileTypeCategory(selectedFileObject.name);
            }

            if (editingDocId) {
                const docRef = doc(db, "archives", editingDocId);
                const updateData = {
                    title: title,
                    folder: finalFolder,
                    date: date || '-',
                    desc: desc || '-'
                };
                
                if (selectedFileObject) {
                    updateData.fileName = fileName;
                    updateData.fileSize = fileSize;
                    updateData.fileType = fileType;
                    updateData.fileUrl = fileUrl;
                }

                await updateDoc(docRef, updateData);
                alert(t.docUpdateAlert);
                cancelEdit();
            } else {
                await addDoc(collection(db, "archives"), {
                    title: title,
                    folder: finalFolder,
                    date: date || '-',
                    fileName: selectedFileObject ? fileName : t.noFile,
                    fileSize: selectedFileObject ? fileSize : '',
                    fileType: selectedFileObject ? fileType : '-',
                    fileUrl: fileUrl || '',
                    desc: desc || '-',
                    timestamp: new Date()
                });

                alert(t.docSuccessAlert);
                resetForm();
            }
        } catch (error) {
            console.error("Erreur : ", error);
            alert(t.docErrorAlert + " " + error.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = editingDocId ? t.btnUpdateDoc : t.btnSubmitDoc;
        }
    }

    window.editArchive = function(id, title, folder, date, fileName, fileSize, fileType, desc) {
        editingDocId = id;
        document.getElementById('docTitle').value = title;
        document.getElementById('finalFolderSelect').value = folder;
        document.getElementById('docDate').value = date !== '-' ? date : '';
        document.getElementById('docDesc').value = desc !== '-' ? desc : '';
        
        if (fileName && fileName !== translations[currentLang].noFile) {
            fileInfoDisplay.textContent = `📎 [${fileType || 'Fichier'}] ${fileName} ${fileSize ? '('+fileSize+')' : ''} - (Gardé si non remplacé)`;
        } else {
            fileInfoDisplay.textContent = '';
        }

        const t = translations[currentLang];
        document.getElementById('btnSubmitDoc').textContent = t.btnUpdateDoc;
        document.getElementById('btnCancelEdit').style.display = 'block';
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.cancelEdit = function() {
        editingDocId = null;
        resetForm();
        document.getElementById('btnCancelEdit').style.display = 'none';
        const t = translations[currentLang];
        document.getElementById('btnSubmitDoc').textContent = t.btnSubmitDoc;
    }

    function resetForm() {
        document.getElementById('docTitle').value = '';
        document.getElementById('docDesc').value = '';
        document.getElementById('docDate').value = '';
        fileInput.value = '';
        selectedFileObject = null;
        fileInfoDisplay.textContent = '';
    }

    window.deleteArchive = async function(id) {
        const t = translations[currentLang];
        if(confirm(t.confirmDelete)) {
            try {
                await deleteDoc(doc(db, "archives", id));
                if (editingDocId === id) cancelEdit();
            } catch (error) {
                console.error("Erreur de suppression : ", error);
                alert("Erreur lors de la suppression.");
            }
        }
    }

    function renderArchives(dataList) {
        const container = document.getElementById('archivesList');
        const t = translations[currentLang];
        
        container.innerHTML = '';

        if (dataList.length === 0) {
            const msg = allArchivesData.length === 0 ? t.emptyText : t.noSearchResult;
            container.innerHTML = `<div class="no-archive">${msg}</div>`;
            return;
        }

        dataList.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'archive-card';
            
            const safeTitle = (item.title || '').replace(/'/g, "\\'");
            const safeFolder = (item.folder || '').replace(/'/g, "\\'");
            const safeDate = (item.date || '').replace(/'/g, "\\'");
            const safeFileName = (item.fileName || '').replace(/'/g, "\\'");
            const safeFileSize = (item.fileSize || '').replace(/'/g, "\\'");
            const safeFileType = (item.fileType || getFileTypeCategory(item.fileName)).replace(/'/g, "\\'");
            const safeDesc = (item.desc || '').replace(/'/g, "\\'");

            const computedType = item.fileType || getFileTypeCategory(item.fileName);
            let fileDisplayStr = item.fileName || t.noFile;
            if (item.fileSize) {
                fileDisplayStr += ` (${item.fileSize})`;
            }

            // Si un lien de téléchargement Storage existe, on ajoute un bouton/lien direct
            if (item.fileUrl) {
                fileDisplayStr += ` <a href="${item.fileUrl}" target="_blank" class="file-link">${t.downloadFile}</a>`;
            }

            let actionsHtml = `<div class="archive-actions">`;
            actionsHtml += `<button onclick="editArchive('${item.id}', '${safeTitle}', '${safeFolder}', '${safeDate}', '${safeFileName}', '${safeFileSize}', '${safeFileType}', '${safeDesc}')" class="btn-edit">${t.editBtn}</button>`;
            actionsHtml += `<button onclick="deleteArchive('${item.id}')" class="btn-delete">${t.deleteBtn}</button>`;
            actionsHtml += `</div>`;

            card.innerHTML = `
                <div class="archive-header">
                    <span class="archive-title">${item.title}</span>
                    <span class="archive-folder">📁 ${item.folder}</span>
                </div>
                <div class="archive-details">
                    <div>📅 Date : ${item.date}</div>
                    <div>📎 Fichier : <span class="file-badge">${computedType}</span> ${fileDisplayStr}</div>
                    <div>📝 Description : ${item.desc}</div>
                </div>
                ${actionsHtml}
            `;
            container.appendChild(card);
        });
    }

    window.filterArchives = function() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        if (!query) {
            renderArchives(allArchivesData);
            return;
        }

        const filtered = allArchivesData.filter(item => {
            const fType = (item.fileType || getFileTypeCategory(item.fileName)).toLowerCase();
            return (
                (item.title && item.title.toLowerCase().includes(query)) ||
                (item.folder && item.folder.toLowerCase().includes(query)) ||
                (item.fileName && item.fileName.toLowerCase().includes(query)) ||
                (fType.includes(query)) ||
                (item.fileSize && item.fileSize.toLowerCase().includes(query)) ||
                (item.desc && item.desc.toLowerCase().includes(query)) ||
                (item.date && item.date.toLowerCase().includes(query))
            );
        });

        renderArchives(filtered);
    }

    function loadArchives() {
        onSnapshot(collection(db, "archives"), (snapshot) => {
            allArchivesData = [];
            snapshot.forEach((docSnap) => {
                allArchivesData.push({
                    id: docSnap.id,
                    ...docSnap.data()
                });
            });
            filterArchives();
        });
    }

    window.updateAllSelects();
    loadArchives();
</script>

</body>
</html>
