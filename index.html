<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THC - Gestionnaire d'Archives</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #64748b;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 { font-size: 2rem; color: #0f172a; margin-bottom: 5px; }
        .header p { color: var(--secondary); }

        .card {
            background: var(--card);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 24px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
            margin-top: 8px;
            margin-bottom: 16px;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; color: var(--secondary); font-size: 0.85rem; padding-bottom: 12px; border-bottom: 2px solid #e2e8f0; }
        td { padding: 16px 0; border-bottom: 1px solid #e2e8f0; }
        
        .folder-tag {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-right: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>THC Archives</h1>
        <p>Gestion sécurisée de vos documents</p>
    </div>

    <!-- Connexion -->
    <div class="card" style="text-align: center;">
        <button id="auth-button" onclick="handleAuthClick()">Se connecter à Google Drive</button>
        <button id="signout-button" style="display:none; background:#ef4444;" onclick="handleSignoutClick()">Déconnexion</button>
    </div>

    <!-- Formulaire -->
    <div class="card">
        <h3>Ajouter un document</h3>
        <input type="text" id="titre" placeholder="Titre du document">
        <select id="dossierSelect"></select>
        <textarea id="description" placeholder="Description..."></textarea>
        <button onclick="ajouterArchive()">Enregistrer l'archive</button>
    </div>

    <!-- Liste -->
    <div class="card">
        <h3>Mes Documents</h3>
        <table id="tableArchives">
            <thead>
                <tr><th>Titre</th><th>Dossier</th><th>Action</th></tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
</div>

</body>
</html>
