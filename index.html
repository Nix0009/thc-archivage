<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Système d'Archivage - Trust Handling Company (THC)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --bg-color: #f8f9fa;
            --border-color: #dcdde1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
            background-color: #34495e;
            padding: 15px;
            border-radius: 8px;
            color: white;
        }

        .logo-container img {
            max-height: 80px;
            width: auto;
            display: block;
            margin: 0 auto 10px auto;
        }

        .org-name {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.5px;
            color: #ecf0f1;
            margin: 0;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 25px;
        }

        .section-box {
            background: #f1f2f6;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
            color: var(--primary-color);
        }

        input, select, textarea {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #219653;
        }

        .btn-folder-add {
            background-color: var(--accent-color);
        }
        .btn-folder-add:hover {
            background-color: #2980b9;
        }

        .search-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .search-bar input {
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        th {
            background-color: var(--primary-color);
            color: white;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .btn-delete {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-delete:hover {
            background-color: #c0392b;
        }

        .folders-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .folder-badge {
            background-color: #e2e8f0;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .folder-badge span {
            cursor: pointer;
            color: #e74c3c;
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            color: #7f8c8d;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- En-tête avec Logo et Nom de l'Organisation -->
    <div class="logo-container">
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Logo Trust Handling Company">
        <p class="org-name">Trust Handling Company (THC)</p>
    </div>

    <h1>Gestionnaire d'Archives</h1>

    <!-- Connexion Google Drive -->
    <div class="section-box" style="text-align: center;">
        <h3>Connexion Google Drive</h3>
        <button id="auth-button" onclick="handleAuthClick()" class="btn-folder-add">Se connecter Google Drive</button>
        <button id="signout-button" onclick="handleSignoutClick()" class="btn-delete" style="display: none;">Se déconnecter</button>
    </div>

    <!-- Gestion des Dossiers Personnalisés -->
    <div class="section-box">
        <h3>Gérer mes dossiers personnalisés</h3>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="nouveauDossierNom" placeholder="Nom du nouveau dossier (ex: Projet A, Logistique...)" style="flex: 1;">
            <button class="btn-folder-add" onclick="creerDossier()">Créer le dossier</button>
        </div>
        <div class="folders-tags" id="listeDossiersTags">
            <!-- Les badges de dossiers apparaîtront ici -->
        </div>
    </div>

    <!-- Formulaire d'ajout de document -->
    <div class="section-box">
        <h3>Ajouter un nouveau document</h3>
        <div class="form-row">
            <div class="form-group">
                <label for="titre">Titre du document</label>
                <input type="text" id="titre" placeholder="Ex: Rapport Annuel">
            </div>
            <div class="form-group">
                <label for="dossierSelect">Dossier de destination</label>
                <select id="dossierSelect">
                    <!-- Rempli dynamiquement -->
                </select>
            </div>
            <div class="form-group">
                <label for="dateArchivage">Date</label>
                <input type="date" id="dateArchivage">
            </div>
            <div class="form-group">
                <label for="fichier">Fichier</label>
                <input type="file" id="fichier">
            </div>
            <div class="form-group full-width">
                <label for="description">Description / Mots-clés</label>
                <textarea id="description" placeholder="Ajoutez des détails ou des mots-clés..."></textarea>
            </div>
        </div>
        <button onclick="ajouterArchive()" style="width: 100%;">Enregistrer dans les archives</button>
    </div>

    <!-- Barre de recherche -->
    <div class="search-bar">
        <input type="text" id="rechercheInput" placeholder="Rechercher par titre, dossier ou description..." onkeyup="filtrerArchives()">
    </div>

    <!-- Tableau des archives -->
    <table>
        <thead>
            <tr>
                <th>Titre</th>
                <th>Dossier</th>
                <th>Date</th>
                <th>Nom du fichier</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="tableArchives">
            <!-- Les archives s'afficheront ici -->
        </tbody>
    </table>
</div>

<!-- Scripts Google API pour l'authentification Drive -->
<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

<script>
    // Configuration Google API
    const CLIENT_ID = '93983819430-c35tovnnh1b2gqslc0n758e5v766jts4.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';

    let tokenClient;
    let gapiInited = false;
    let gisInited = false;

    function gapiLoaded() {
        gapi.load('client', initializeGapiClient);
    }

    async function initializeGapiClient() {
        await gapi.client.init({
            discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
        });
        gapiInited = true;
        maybeEnableButtons();
    }

    function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPES,
            callback: '', // défini lors de la requête
        });
        gisInited = true;
        maybeEnableButtons();
    }

    function maybeEnableButtons() {
        if (gapiInited && gisInited) {
            document.getElementById('auth-button').style.display = 'block';
        }
    }

    function handleAuthClick() {
        tokenClient.callback = async (resp) => {
            if (resp.error !== undefined) {
                throw (resp);
            }
            document.getElementById('auth-button').style.display = 'none';
            document.getElementById('signout-button').style.display = 'block';
        };

        if (gapi.client.getToken() === null) {
            tokenClient.requestAccessToken({prompt: 'consent'});
        } else {
            tokenClient.requestAccessToken({prompt: ''});
        }
    }

    function handleSignoutClick() {
        const token = gapi.client.getToken();
        if (token !== null) {
            google.accounts.oauth2.revoke(token.access_token, () => {
                gapi.client.setToken('');
                document.getElementById('auth-button').style.display = 'block';
                document.getElementById('signout-button').style.display = 'none';
            });
        }
    }

    // Charger les données depuis le stockage local
    let archives = JSON.parse(localStorage.getItem('mes_archives_tch')) || [];
    let dossiers = JSON.parse(localStorage.getItem('mes_dossiers_tch')) || ['Général', 'Rapports', 'Administratif'];

    document.getElementById('dateArchivage').valueAsDate = new Date();

    function initialiserDossiers() {
        const select = document.getElementById('dossierSelect');
        const tagsContainer = document.getElementById('listeDossiersTags');
         
        select.innerHTML = '';
        tagsContainer.innerHTML = '';

        dossiers.forEach((dossier, index) => {
            const option = document.createElement('option');
            option.value = dossier;
            option.textContent = dossier;
            select.appendChild(option);

            const badge = document.createElement('div');
            badge.className = 'folder-badge';
            badge.innerHTML = `📁 <strong>${dossier}</strong> <span onclick="renommerDossier(${index})" title="Renommer">✏️</span> <span onclick="supprimerDossier(${index})" title="Supprimer">❌</span>`;
            tagsContainer.appendChild(badge);
        });
    }

    function creerDossier() {
        const nomInput = document.getElementById('nouveauDossierNom');
        const nomDossier = nomInput.value.trim();

        if (!nomDossier) {
            alert("Veuillez entrer un nom de dossier.");
            return;
        }

        if (dossiers.includes(nomDossier)) {
            alert("Ce dossier existe déjà.");
            return;
        }

        dossiers.push(nomDossier);
        sauvegarderDossiers();
        nomInput.value = '';
    }

    function renommerDossier(index) {
        const ancienNom = dossiers[index];
        const nouveauNom = prompt(`Renommer le dossier "${ancienNom}" par :`, ancienNom);

        if (nouveauNom && nouveauNom.trim() !== "") {
            const nomClean = nouveauNom.trim();
            if (dossiers.includes(nomClean)) {
                alert("Un dossier porte déjà ce nom.");
                return;
            }

            dossiers[index] = nomClean;

            archives.forEach(item => {
                if (item.dossier === ancienNom) {
                    item.dossier = nomClean;
                }
            });

            localStorage.setItem('mes_archives_tch', JSON.stringify(archives));
            sauvegarderDossiers();
            afficherArchives(archives);
        }
    }

    function supprimerDossier(index) {
        if (dossiers.length <= 1) {
            alert("Vous devez garder au moins un dossier.");
            return;
        }

        const dossierASupprimer = dossiers[index];
        if (confirm(`Voulez-vous vraiment supprimer le dossier "${dossierASupprimer}" ?`)) {
            dossiers.splice(index, 1);
            sauvegarderDossiers();
        }
    }

    function sauvegarderDossiers() {
        localStorage.setItem('mes_dossiers_tch', JSON.stringify(dossiers));
        initialiserDossiers();
    }

    function ajouterArchive() {
        const titre = document.getElementById('titre').value.trim();
        const dossier = document.getElementById('dossierSelect').value;
        const date = document.getElementById('dateArchivage').value;
        const fichierInput = document.getElementById('fichier');
        const description = document.getElementById('description').value.trim();

        if (!titre) {
            alert("Veuillez saisir un titre pour le document.");
            return;
        }

        const nomFichier = fichierInput.files.length > 0 ? fichierInput.files[0].name : "Aucun fichier";

        const nouvelleArchive = {
            id: Date.now(),
            titre,
            dossier,
            date,
            nomFichier,
            description
        };

        archives.push(nouvelleArchive);
        sauvegarderEtAfficher();
        viderFormulaire();
    }

    function afficherArchives(liste) {
        const tbody = document.getElementById('tableArchives');
        tbody.innerHTML = '';

        if (liste.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="empty-state">Aucune archive trouvée.</td></tr>`;
            return;
        }

        liste.forEach((item) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.titre}</strong></td>
                <td>📁 ${item.dossier}</td>
                <td>${item.date}</td>
                <td>${item.nomFichier}</td>
                <td>${item.description}</td>
                <td><button class="btn-delete" onclick="supprimerArchive(${item.id})">Supprimer</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function supprimerArchive(id) {
        if (confirm("Voulez-vous vraiment supprimer cette archive ?")) {
            archives = archives.filter(item => item.id !== id);
            sauvegarderEtAfficher();
        }
    }

    function filtrerArchives() {
        const query = document.getElementById('rechercheInput').value.toLowerCase();
        const resultatFiltre = archives.filter(item => 
            item.titre.toLowerCase().includes(query) ||
            item.dossier.toLowerCase().includes(query) ||
            item.description.toLowerCase().includes(query) ||
            item.nomFichier.toLowerCase().includes(query)
        );
        afficherArchives(resultatFiltre);
    }

    function sauvegarderEtAfficher() {
        localStorage.setItem('mes_archives_tch', JSON.stringify(archives));
        afficherArchives(archives);
    }

    function viderFormulaire() {
        document.getElementById('titre').value = '';
        document.getElementById('description').value = '';
        document.getElementById('fichier').value = '';
        document.getElementById('dateArchivage').valueAsDate = new Date();
    }

    initialiserDossiers();
    afficherArchives(archives);
</script>

</body>
</html>
