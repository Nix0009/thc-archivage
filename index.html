<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Système d'Archivage - Trust Handling Company</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- En-tête -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-blue-900 font-black px-3 py-2 rounded shadow-md tracking-wider flex items-center justify-center text-lg border-2 border-blue-200">
                    THC
                </div>
                <div>
                    <h1 class="text-xl font-bold leading-tight">Trust Handling Company</h1>
                    <span class="text-xs text-blue-200 uppercase tracking-widest">Archivage Direct Google Drive</span>
                </div>
            </div>
            
            <!-- Zone d'authentification Google -->
            <div class="flex items-center space-x-4">
                <div id="authStatus" class="text-sm bg-blue-800 px-3 py-1 rounded-full text-blue-200">Non connecté</div>
                <button id="googleLoginBtn" onclick="handleAuthClick()" class="bg-white text-blue-900 px-4 py-2 rounded-md font-semibold text-sm shadow hover:bg-blue-50 transition flex items-center space-x-2">
                    <i class="fa-brands fa-google text-red-500"></i>
                    <span>Connecter Google Drive</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Panneau de gauche : Formulaire d'upload direct Drive -->
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <h2 class="text-lg font-semibold mb-4 text-blue-900"><i class="fa-solid fa-cloud-arrow-up mr-2"></i>Envoyer sur le Drive</h2>
                <form id="uploadForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Titre de l'archive</label>
                        <input type="text" id="archiveTitle" required placeholder="Ex: Manifeste de vol" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Dossier / Categorie</label>
                        <select id="archiveFolder" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="Operations">Operations</option>
                            <option value="Administratif">Administratif</option>
                            <option value="Financier">Financier</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Fichier à téléverser</label>
                        <input type="file" id="archiveFile" required class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    </div>
                    <button type="submit" id="submitBtn" disabled class="w-full bg-gray-300 text-gray-500 py-2 px-4 rounded-md cursor-not-allowed transition">Connectez-vous d'abord</button>
                </form>
            </div>
        </div>

        <!-- Panneau de droite : Recherche et Tableau des archives -->
        <div class="lg:col-span-3 space-y-6">
            <!-- Barre de recherche -->
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 flex items-center space-x-4">
                <i class="fa-solid fa-search text-gray-400 ml-2"></i>
                <input type="text" id="searchInput" placeholder="Rechercher par titre, nom de fichier, dossier..." class="w-full focus:outline-none text-gray-700" oninput="filterArchives()">
            </div>

            <!-- Liste / Tableau -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Titre / Fichier</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Dossier</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="archivesTableBody" class="bg-white divide-y divide-gray-200">
                        <tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">Veuillez vous connecter à votre compte Google pour voir les archives.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Scripts Logique OAuth & Drive -->
    <script>
        let tokenClient;
        let accessToken = null;

        // Configuration Google API (À configurer avec votre Client ID Google Cloud)
        const CLIENT_ID = 'VOTRE_CLIENT_ID_GOOGLE.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';

        window.onload = function () {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (response) => {
                    if (response.error !== undefined) {
                        alert("Erreur de connexion Google");
                        return;
                    }
                    accessToken = response.access_token;
                    document.getElementById('authStatus').innerText = "Connecté à Google Drive";
                    document.getElementById('authStatus').className = "text-sm bg-green-800 px-3 py-1 rounded-full text-green-200";
                    document.getElementById('googleLoginBtn').innerText = "Compte Lié";
                    
                    const submitBtn = document.getElementById('submitBtn');
                    submitBtn.disabled = false;
                    submitBtn.className = "w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition";
                    
                    loadDriveFiles();
                },
            });
        };

        function handleAuthClick() {
            tokenClient.requestAccessToken({ prompt: 'consent' });
        }

        // Fonction pour envoyer un fichier directement vers Google Drive via l'API REST
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!accessToken) {
                alert("Veuillez d'abord vous connecter à votre compte Google.");
                return;
            }

            const title = document.getElementById('archiveTitle').value;
            const folder = document.getElementById('archiveFolder').value;
            const fileInput = document.getElementById('archiveFile');
            const file = fileInput.files[0];

            if (!file) return;

            const metadata = {
                name: file.name,
                description: title + " [" + folder + "]"
            };

            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', file);

            try {
                const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                    method: 'POST',
                    headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
                    body: form
                });

                if (response.ok) {
                    alert("Fichier téléversé avec succès sur votre Google Drive !");
                    document.getElementById('uploadForm').reset();
                    loadDriveFiles();
                } else {
                    alert("Erreur lors du téléversement sur le Drive.");
                }
            } catch (error) {
                console.error(error);
            }
        });

        // Charger les fichiers stockés par l'application sur le Drive
        async function loadDriveFiles() {
            if (!accessToken) return;

            try {
                const response = await fetch('https://www.googleapis.com/drive/v3/files?q=trashed=false', {
                    headers: new Headers({ 'Authorization': 'Bearer ' + accessToken })
                });
                const data = await response.json();
                renderArchives(data.files || []);
            } catch (error) {
                console.error("Erreur de récupération des fichiers Drive:", error);
            }
        }

        function renderArchives(files) {
            const tbody = document.getElementById('archivesTableBody');
            tbody.innerHTML = '';

            if (files.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">Aucun fichier trouvé sur le Drive.</td></tr>`;
                return;
            }

            files.forEach(file => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900">${file.name}</div>
                        <div class="text-xs text-gray-500">${file.description || ''}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Google Drive</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${new Date(file.createdTime || Date.now()).toLocaleDateString()}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <a href="https://drive.google.com/file/d/${file.id}/view" target="_blank" class="text-green-600 hover:text-green-900 mr-3"><i class="fa-brands fa-google-drive"></i></a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
