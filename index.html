<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Archivage Public - Trust Handling Company</title>
    <style>
        :root {
            --primary-red: #d32f2f;
            --primary-blue: #1976d2;
            --dark-bg: #2c3e50;
            --light-bg: #f8f9fa;
            --accent-color: #34495e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
            background-color: var(--dark-bg);
            padding: 15px;
            border-radius: 10px;
        }
        .logo-container img {
            max-height: 70px;
            width: auto;
            display: block;
            margin: 0 auto;
        }
        h1 {
            color: var(--dark-bg);
            text-align: center;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .management-section {
            background: #eee;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
        }
        h2 { font-size: 16px; margin-top: 0; color: #444; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        input[type="text"], input[type="date"], input[type="file"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: background 0.3s;
        }
        .btn-primary { background-color: var(--primary-blue); }
        .btn-primary:hover { background-color: #0d47a1; }
        
        .btn-secondary { background-color: var(--accent-color); }
        .btn-secondary:hover { background-color: #2c3e50; }

        .flex-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .flex-col { flex: 1; min-width: 200px; }

        @media(min-width: 600px) {
            body { padding: 20px; }
            .container { padding: 30px; }
            h1 { font-size: 24px; }
            h2 { font-size: 18px; }
        }
        
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 25px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            font-size: 13px;
        }
        th {
            background-color: var(--dark-bg);
            color: white;
        }
        td.folder-cell {
            font-family: monospace;
            color: #1976d2;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Logo -->
    <div class="logo-container">
        <img src="https://i.postimg.cc/yxxj5h9m/THC.png" alt="Logo Trust Handling Company">
    </div>

    <h1>Système d'Archivage Public - THC</h1>

    <!-- SECTION GESTION DES SOUS-DOSSIERS -->
    <div class="management-section">
        <h2>⚙️ Créer un sous-dossier</h2>
        <div class="flex-row">
            <div class="flex-col">
                <label for="parentFolderSelect">Dossier Principal cible</label>
                <select id="parentFolderSelect">
                    <!-- Rempli automatiquement -->
                </select>
            </div>
            <div class="flex-col">
                <label for="newSubFolderName">Nom du nouveau sous-dossier</label>
                <input type="text" id="newSubFolderName" placeholder="Ex: Janvier 2026, Factures...">
            </div>
        </div>
        <button onclick="addSubFolder()" class="btn-secondary" style="margin-top: 15px;">Ajouter le sous-dossier</button>
    </div>

    <!-- FORMULAIRE D'ARCHIVAGE -->
    <div class="form-group">
        <label for="docTitle">Titre du document</label>
        <input type="text" id="docTitle" placeholder="Ex: Rapport mensuel">
    </div>

    <div class="form-group">
        <label for="finalFolderSelect">Emplacement de destination (Dossier ou Sous-dossier)</label>
        <select id="finalFolderSelect">
            <!-- Rempli automatiquement -->
        </select>
    </div>

    <div class="form-group">
        <label for="docDate">Date</label>
        <input type="date" id="docDate">
    </div>

    <div class="form-group">
        <label for="docFile">Sélectionner un fichier (Word, Excel, PDF, Image...)</label>
        <!-- MODIFICATION APPLIQUÉE ICI : Accepte Word, Excel, PDF, Images -->
        <input type="file" id="docFile" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
    </div>

    <div class="form-group">
        <label for="docDesc">Description / Mots-clés</label>
        <textarea id="docDesc" rows="2" placeholder="Détails optionnels..."></textarea>
    </div>

    <button onclick="addDocument()" class="btn-primary">Enregistrer dans les archives publiques</button>

    <!-- TABLEAU DES ARCHIVES -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Titre</th>
                    <th>Emplacement</th>
                    <th>Date</th>
                    <th>Fichier</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody id="archiveTableBody">
                <tr><td colspan="5" style="text-align: center; color: #777;">Chargement des archives depuis le cloud...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Importation de Firebase SDK (Version Modulaire 10) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Votre configuration Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDTfE06jD2NUS7-l5ynx0Iy-kFtg-8IzPw",
        authDomain: "thc-archivage.firebaseapp.com",
        projectId: "thc-archivage",
        storageBucket: "thc-archivage.firebasestorage.app",
        messagingSenderId: "630363860954",
        appId: "1:630363860954:web:953c7a0e15bfa53b469ae3",
        measurementId: "G-9MDJ6J0CK3"
    };

    // Initialisation Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Structure des dossiers de base
    let folderStructure = {
        "Administration": [],
        "Comptabilité": [],
        "Audits": [],
        "Contrats": [],
        "Rapport": []
    };

    // Remplir les listes déroulantes
    window.updateAllSelects = function() {
        const parentSelect = document.getElementById('parentFolderSelect');
        const finalSelect = document.getElementById('finalFolderSelect');
        
        if(!parentSelect || !finalSelect) return;

        const currentParent = parentSelect.value;
        const currentFinal = finalSelect.value;

        parentSelect.innerHTML = '';
        finalSelect.innerHTML = '';

        for (const mainFolder in folderStructure) {
            const parentOption = document.createElement('option');
            parentOption.value = mainFolder;
            parentOption.textContent = mainFolder;
            parentSelect.appendChild(parentOption);

            const mainOptionFinal = document.createElement('option');
            mainOptionFinal.value = mainFolder;
            mainOptionFinal.textContent = `📁 ${mainFolder}`;
            finalSelect.appendChild(mainOptionFinal);

            if(folderStructure[mainFolder]) {
                folderStructure[mainFolder].forEach(subFolder => {
                    const subOption = document.createElement('option');
                    subOption.value = `${mainFolder} / ${subFolder}`;
                    subOption.textContent = `   └─ ${subFolder}`;
                    finalSelect.appendChild(subOption);
                });
            }
        }

        if(currentParent) parentSelect.value = currentParent;
        if(currentFinal) finalSelect.value = currentFinal;
    }

    window.addSubFolder = function() {
        const parent = document.getElementById('parentFolderSelect').value;
        const subName = document.getElementById('newSubFolderName').value.trim();

        if(!subName) {
            alert("Veuillez entrer un nom pour le sous-dossier.");
            return;
        }

        if(!folderStructure[parent].includes(subName)) {
            folderStructure[parent].push(subName);
            document.getElementById('newSubFolderName').value = '';
            window.updateAllSelects();
            alert(`Sous-dossier '${subName}' créé avec succès !`);
        } else {
            alert("Ce sous-dossier existe déjà.");
        }
    }

    // Enregistrer un document dans Firestore
    window.addDocument = async function() {
        const title = document.getElementById('docTitle').value;
        const finalFolder = document.getElementById('finalFolderSelect').value;
        const date = document.getElementById('docDate').value;
        const fileInput = document.getElementById('docFile');
        const desc = document.getElementById('docDesc').value;

        if(!title) {
            alert('Veuillez entrer un titre de document.');
            return;
        }

        let fileName = 'Aucun fichier';
        if(fileInput.files && fileInput.files.length > 0) {
            fileName = fileInput.files[0].name;
        }

        try {
            await addDoc(collection(db, "archives"), {
                title: title,
                folder: finalFolder,
                date: date || '-',
                fileName: fileName,
                desc: desc || '-',
                timestamp: new Date()
            });

            alert('Document archivé avec succès dans le cloud public !');
            
            document.getElementById('docTitle').value = '';
            document.getElementById('docFile').value = '';
            document.getElementById('docDesc').value = '';
            document.getElementById('docDate').value = '';

        } catch (error) {
            console.error("Erreur lors de l'enregistrement : ", error);
            alert("Erreur lors de l'enregistrement dans le cloud.");
        }
    }

    // Charger et écouter les modifications du tableau en temps réel depuis Firestore
    function loadArchives() {
        const tbody = document.getElementById('archiveTableBody');
        
        onSnapshot(collection(db, "archives"), (snapshot) => {
            tbody.innerHTML = '';
            
            if (snapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #777;">Aucune archive pour le moment.</td></tr>';
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${data.title}</strong></td>
                    <td class="folder-cell">${data.folder}</td>
                    <td>${data.date}</td>
                    <td>${data.fileName}</td>
                    <td>${data.desc}</td>
                `;
                tbody.appendChild(row);
            });
        });
    }

    window.updateAllSelects();
    loadArchives();
</script>

</body>
</html>
