<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="pageTitle">Archivage - Trust Handling Company</title>
    <style>
        :root {
            --primary-red: #d32f2f;
            --primary-blue: #1976d2;
            --dark-bg: #2c3e50;
            --light-bg: #f8f9fa;
            --accent-color: #34495e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .lang-select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
            background-color: var(--dark-bg);
            padding: 15px;
            border-radius: 10px;
        }
        .logo-container img {
            max-height: 70px;
            width: auto;
            display: block;
            margin: 0 auto;
        }
        h1 {
            color: var(--dark-bg);
            text-align: center;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .management-section {
            background: #eee;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
        }
        h2 { font-size: 16px; margin-top: 0; color: #444; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        input[type="text"], input[type="date"], input[type="file"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: background 0.3s;
        }
        .btn-primary { background-color: var(--primary-blue); }
        .btn-primary:hover { background-color: #0d47a1; }
        
        .btn-secondary { background-color: var(--accent-color); }
        .btn-secondary:hover { background-color: #2c3e50; }

        .flex-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .flex-col { flex: 1; min-width: 200px; }

        @media(min-width: 600px) {
            body { padding: 20px; }
            .container { padding: 30px; }
            h1 { font-size: 24px; }
            h2 { font-size: 18px; }
        }
        
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 25px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            font-size: 13px;
        }
        th {
            background-color: var(--dark-bg);
            color: white;
        }
        td.folder-cell {
            font-family: monospace;
            color: #1976d2;
            font-weight: bold;
        }
        .btn-download {
            background-color: #2e7d32;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            display: inline-block;
        }
        .btn-download:hover { background-color: #1b5e20; }
    </style>
</head>
<body>

<div class="container">
    <!-- Sélecteur de langue en haut -->
    <div class="header-bar">
        <span></span>
        <select id="langSelector" class="lang-select" onchange="changeLanguage()">
            <option value="fr">🇫🇷 Français</option>
            <option value="en">🇬🇧 English</option>
        </select>
    </div>

    <!-- Logo -->
    <div class="logo-container">
        <img src="https://i.postimg.cc/yxxj5h9m/THC.png" alt="Logo Trust Handling Company">
    </div>

    <h1 id="mainTitle">Système d'Archivage - THC</h1>

    <!-- SECTION GESTION DES SOUS-DOSSIERS -->
    <div class="management-section">
        <h2 id="subFolderSectionTitle">⚙️ Créer un sous-dossier</h2>
        <div class="flex-row">
            <div class="flex-col">
                <label id="lblParentFolder" for="parentFolderSelect">Dossier Principal cible</label>
                <select id="parentFolderSelect">
                    <!-- Rempli automatiquement -->
                </select>
            </div>
            <div class="flex-col">
                <label id="lblSubFolderName" for="newSubFolderName">Nom du nouveau sous-dossier</label>
                <input type="text" id="newSubFolderName" placeholder="Ex: Janvier 2026, Factures...">
            </div>
        </div>
        <button id="btnAddSubFolder" onclick="addSubFolder()" class="btn-secondary" style="margin-top: 15px;">Ajouter le sous-dossier</button>
    </div>

    <!-- FORMULAIRE D'ARCHIVAGE -->
    <div class="form-group">
        <label id="lblDocTitle" for="docTitle">Titre du document</label>
        <input type="text" id="docTitle" placeholder="Ex: Rapport mensuel">
    </div>

    <div class="form-group">
        <label id="lblFinalFolder" for="finalFolderSelect">Emplacement de destination (Dossier ou Sous-dossier)</label>
        <select id="finalFolderSelect">
            <!-- Rempli automatiquement -->
        </select>
    </div>

    <div class="form-group">
        <label id="lblDocDate" for="docDate">Date</label>
        <input type="date" id="docDate">
    </div>

    <div class="form-group">
        <label id="lblDocFile" for="docFile">Document (Word, Excel, PDF, Image...)</label>
        <input type="file" id="docFile" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
    </div>

    <div class="form-group">
        <label id="lblDocDesc" for="docDesc">Description / Mots-clés</label>
        <textarea id="docDesc" rows="2" placeholder="Détails optionnels..."></textarea>
    </div>

    <button id="btnSubmitDoc" onclick="addDocument()" class="btn-primary">Enregistrer dans les archives</button>

    <!-- TABLEAU DES ARCHIVES -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th id="thTitle">Titre</th>
                    <th id="thFolder">Emplacement</th>
                    <th id="thDate">Date</th>
                    <th id="thFile">Fichier</th>
                    <th id="thDesc">Description</th>
                    <th id="thAction">Action</th>
                </tr>
            </thead>
            <tbody id="archiveTableBody">
                <tr><td colspan="6" id="loadingText" style="text-align: center; color: #777;">Chargement des archives depuis le cloud...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Importation de Firebase SDK (Version Modulaire 10) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // Votre configuration Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDTfE06jD2NUS7-l5ynx0Iy-kFtg-8IzPw",
        authDomain: "thc-archivage.firebaseapp.com",
        projectId: "thc-archivage",
        storageBucket: "thc-archivage.firebasestorage.app",
        messagingSenderId: "630363860954",
        appId: "1:630363860954:web:953c7a0e15bfa53b469ae3",
        measurementId: "G-9MDJ6J0CK3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // Dictionnaire de traduction
    const translations = {
        fr: {
            pageTitle: "Archivage - Trust Handling Company",
            mainTitle: "Système d'Archivage - THC",
            subFolderSectionTitle: "⚙️ Créer un sous-dossier",
            lblParentFolder: "Dossier Principal cible",
            lblSubFolderName: "Nom du nouveau sous-dossier",
            subFolderPlaceholder: "Ex: Janvier 2026, Factures...",
            btnAddSubFolder: "Ajouter le sous-dossier",
            lblDocTitle: "Titre du document",
            docTitlePlaceholder: "Ex: Rapport mensuel",
            lblFinalFolder: "Emplacement de destination (Dossier ou Sous-dossier)",
            lblDocDate: "Date",
            lblDocFile: "Document (Word, Excel, PDF, Image...)",
            lblDocDesc: "Description / Mots-clés",
            docDescPlaceholder: "Détails optionnels...",
            btnSubmitDoc: "Enregistrer dans les archives",
            thTitle: "Titre",
            thFolder: "Emplacement",
            thDate: "Date",
            thFile: "Fichier",
            thDesc: "Description",
            thAction: "Action",
            loadingText: "Chargement des archives depuis le cloud...",
            emptyText: "Aucune archive pour le moment.",
            subFolderSuccess: "Sous-dossier créé avec succès !",
            subFolderExists: "Ce sous-dossier existe déjà.",
            subFolderAlert: "Veuillez entrer un nom pour le sous-dossier.",
            docTitleAlert: "Veuillez entrer un titre de document.",
            docSuccessAlert: "Document et fichier archivés avec succès !",
            docErrorAlert: "Erreur lors de l'enregistrement.",
            uploadingText: "Envoi du fichier en cours...",
            noFile: "Aucun fichier",
            downloadBtn: "📥 Télécharger"
        },
        en: {
            pageTitle: "Archiving - Trust Handling Company",
            mainTitle: "Archiving System - THC",
            subFolderSectionTitle: "⚙️ Create a Sub-folder",
            lblParentFolder: "Target Main Folder",
            lblSubFolderName: "New Sub-folder Name",
            subFolderPlaceholder: "Ex: January 2026, Invoices...",
            btnAddSubFolder: "Add Sub-folder",
            lblDocTitle: "Document Title",
            docTitlePlaceholder: "Ex: Monthly report",
            lblFinalFolder: "Destination Location (Folder or Sub-folder)",
            lblDocDate: "Date",
            lblDocFile: "Document (Word, Excel, PDF, Image...)",
            lblDocDesc: "Description / Keywords",
            docDescPlaceholder: "Optional details...",
            btnSubmitDoc: "Save to Archives",
            thTitle: "Title",
            thFolder: "Location",
            thDate: "Date",
            thFile: "File",
            thDesc: "Description",
            thAction: "Action",
            loadingText: "Loading archives from the cloud...",
            emptyText: "No archives yet.",
            subFolderSuccess: "Sub-folder created successfully!",
            subFolderExists: "This sub-folder already exists.",
            subFolderAlert: "Please enter a name for the sub-folder.",
            docTitleAlert: "Please enter a document title.",
            docSuccessAlert: "Document and file successfully archived!",
            docErrorAlert: "Error saving.",
            uploadingText: "Uploading file...",
            noFile: "No file",
            downloadBtn: "📥 Download"
        }
    };

    let currentLang = 'fr';

    window.changeLanguage = function() {
        currentLang = document.getElementById('langSelector').value;
        const t = translations[currentLang];

        document.getElementById('pageTitle').textContent = t.pageTitle;
        document.getElementById('mainTitle').textContent = t.mainTitle;
        document.getElementById('subFolderSectionTitle').textContent = t.subFolderSectionTitle;
        document.getElementById('lblParentFolder').textContent = t.lblParentFolder;
        document.getElementById('lblSubFolderName').textContent = t.lblSubFolderName;
        document.getElementById('newSubFolderName').placeholder = t.subFolderPlaceholder;
        document.getElementById('btnAddSubFolder').textContent = t.btnAddSubFolder;
        document.getElementById('lblDocTitle').textContent = t.lblDocTitle;
        document.getElementById('docTitle').placeholder = t.docTitlePlaceholder;
        document.getElementById('lblFinalFolder').textContent = t.lblFinalFolder;
        document.getElementById('lblDocDate').textContent = t.lblDocDate;
        document.getElementById('lblDocFile').textContent = t.lblDocFile;
        document.getElementById('lblDocDesc').textContent = t.lblDocDesc;
        document.getElementById('docDesc').placeholder = t.docDescPlaceholder;
        document.getElementById('btnSubmitDoc').textContent = t.btnSubmitDoc;
        document.getElementById('thTitle').textContent = t.thTitle;
        document.getElementById('thFolder').textContent = t.thFolder;
        document.getElementById('thDate').textContent = t.thDate;
        document.getElementById('thFile').textContent = t.thFile;
        document.getElementById('thDesc').textContent = t.thDesc;
        document.getElementById('thAction').textContent = t.thAction;
        
        const loadingEl = document.getElementById('loadingText');
        if(loadingEl) loadingEl.textContent = t.loadingText;
    }

    let folderStructure = {
        "Administration": [],
        "Comptabilité": [],
        "Audits": [],
        "Contrats": [],
        "Rapport": []
    };

    window.updateAllSelects = function() {
        const parentSelect = document.getElementById('parentFolderSelect');
        const finalSelect = document.getElementById('finalFolderSelect');
        
        if(!parentSelect || !finalSelect) return;

        const currentParent = parentSelect.value;
        const currentFinal = finalSelect.value;

        parentSelect.innerHTML = '';
        finalSelect.innerHTML = '';

        for (const mainFolder in folderStructure) {
            const parentOption = document.createElement('option');
            parentOption.value = mainFolder;
            parentOption.textContent = mainFolder;
            parentSelect.appendChild(parentOption);

            const mainOptionFinal = document.createElement('option');
            mainOptionFinal.value = mainFolder;
            mainOptionFinal.textContent = `📁 ${mainFolder}`;
            finalSelect.appendChild(mainOptionFinal);

            if(folderStructure[mainFolder]) {
                folderStructure[mainFolder].forEach(subFolder => {
                    const subOption = document.createElement('option');
                    subOption.value = `${mainFolder} / ${subFolder}`;
                    subOption.textContent = `   └─ ${subFolder}`;
                    finalSelect.appendChild(subOption);
                });
            }
        }

        if(currentParent) parentSelect.value = currentParent;
        if(currentFinal) finalSelect.value = currentFinal;
    }

    window.addSubFolder = function() {
        const t = translations[currentLang];
        const parent = document.getElementById('parentFolderSelect').value;
        const subName = document.getElementById('newSubFolderName').value.trim();

        if(!subName) {
            alert(t.subFolderAlert);
            return;
        }

        if(!folderStructure[parent].includes(subName)) {
            folderStructure[parent].push(subName);
            document.getElementById('newSubFolderName').value = '';
            window.updateAllSelects();
            alert(t.subFolderSuccess);
        } else {
            alert(t.subFolderExists);
        }
    }

    window.addDocument = async function() {
        const t = translations[currentLang];
        const title = document.getElementById('docTitle').value;
        const finalFolder = document.getElementById('finalFolderSelect').value;
        const date = document.getElementById('docDate').value;
        const fileInput = document.getElementById('docFile');
        const desc = document.getElementById('docDesc').value;

        if(!title) {
            alert(t.docTitleAlert);
            return;
        }

        let fileName = t.noFile;
        let fileUrl = "";

        const submitBtn = document.getElementById('btnSubmitDoc');
        submitBtn.disabled = true;
        submitBtn.textContent = t.uploadingText;

        try {
            if(fileInput.files && fileInput.files.length > 0) {
                const file = fileInput.files[0];
                fileName = file.name;
                const storageRef = ref(storage, 'documents/' + Date.now() + '_' + fileName);
                const snapshot = await uploadBytes(storageRef, file);
                fileUrl = await getDownloadURL(snapshot.ref);
            }

            await addDoc(collection(db, "archives"), {
                title: title,
                folder: finalFolder,
                date: date || '-',
                fileName: fileName,
                fileUrl: fileUrl,
                desc: desc || '-',
                timestamp: new Date()
            });

            alert(t.docSuccessAlert);
            
            document.getElementById('docTitle').value = '';
            document.getElementById('docFile').value = '';
            document.getElementById('docDesc').value = '';
            document.getElementById('docDate').value = '';

        } catch (error) {
            console.error("Erreur : ", error);
            alert(t.docErrorAlert);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = t.btnSubmitDoc;
        }
    }

    function loadArchives() {
        const tbody = document.getElementById('archiveTableBody');
        
        onSnapshot(collection(db, "archives"), (snapshot) => {
            tbody.innerHTML = '';
            const t = translations[currentLang];
            
            if (snapshot.empty) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #777;">${t.emptyText}</td></tr>`;
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const row = document.createElement('tr');
                
                let actionHtml = '-';
                if (data.fileUrl) {
                    actionHtml = `<a href="${data.fileUrl}" target="_blank" class="btn-download">${t.downloadBtn}</a>`;
                }

                row.innerHTML = `
                    <td><strong>${data.title}</strong></td>
                    <td class="folder-cell">${data.folder}</td>
                    <td>${data.date}</td>
                    <td>${data.fileName}</td>
                    <td>${data.desc}</td>
                    <td>${actionHtml}</td>
                `;
                tbody.appendChild(row);
            });
        });
    }

    window.updateAllSelects();
    loadArchives();
</script>

</body>
</html>
