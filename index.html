<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivage THC - Pro</title>
    <style>
        :root { --primary-blue: #1976d2; --danger: #d32f2f; --secondary: #34495e; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .card { border: 1px solid #ddd; padding: 15px; margin-top: 10px; border-radius: 8px; }
        .btn-del { background: var(--danger); color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
        .search-box { background: #e3f2fd; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Système d'Archivage THC</h1>

    <!-- Recherche -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Rechercher dans les archives (titre)..." onkeyup="filterArchives()">
    </div>

    <!-- Gestion Dossiers -->
    <div class="card">
        <h3>📂 Gestion des Dossiers</h3>
        <select id="folderListForDeletion"></select>
        <button onclick="deleteFolder()" class="btn-del">Supprimer le dossier sélectionné</button>
    </div>

    <!-- Liste Archives -->
    <div id="archivesList"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, deleteDoc, doc, onSnapshot, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDTfE06jD2NUS7-l5ynx0Iy-kFtg-8IzPw",
        projectId: "thc-archivage",
        storageBucket: "thc-archivage.firebasestorage.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allArchives = [];

    // SUPPRIMER ARCHIVE
    window.deleteArchive = async (id) => {
        if(confirm("Supprimer cette archive ?")) await deleteDoc(doc(db, "archives", id));
    };

    // SUPPRIMER DOSSIER
    window.deleteFolder = async () => {
        const folder = document.getElementById('folderListForDeletion').value;
        if(!confirm(`Supprimer le dossier ${folder} ?`)) return;
        
        const docSnap = await getDoc(doc(db, "settings", "folders"));
        let structure = docSnap.data().structure;
        
        // Logique simplifiée de suppression
        delete structure[folder]; 
        await setDoc(doc(db, "settings", "folders"), { structure });
        alert("Dossier supprimé");
    };

    // FILTRAGE RECHERCHE
    window.filterArchives = () => {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const list = document.getElementById('archivesList');
        list.innerHTML = '';
        allArchives.filter(a => a.title.toLowerCase().includes(term)).forEach(a => {
            list.innerHTML += `
                <div class="card">
                    <strong>${a.title}</strong> - ${a.folder}
                    <button onclick="deleteArchive('${a.id}')" class="btn-del" style="float:right;">Supprimer</button>
                </div>`;
        });
    };

    onSnapshot(collection(db, "archives"), (snap) => {
        allArchives = [];
        snap.forEach(d => allArchives.push({id: d.id, ...d.data()}));
        filterArchives();
    });
</script>
</body>
</html>
