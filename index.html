<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Système d'Archivage - Trust Handling Company</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- En-tête -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <!-- Remplacement par un badge/logo THC stylisé garanti sans erreur de chargement -->
                <div class="bg-white text-blue-900 font-black px-3 py-2 rounded shadow-md tracking-wider flex items-center justify-center text-lg border-2 border-blue-200">
                    THC
                </div>
                <div>
                    <h1 class="text-xl font-bold leading-tight">Trust Handling Company</h1>
                    <span class="text-xs text-blue-200 uppercase tracking-widest">Système d'Archivage</span>
                </div>
            </div>
            <span id="loadingText" class="text-sm bg-blue-800 px-3 py-1 rounded-full text-blue-200">Connexion à Firebase...</span>
        </div>
    </header>

    <main class="container mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Panneau de gauche : Formulaire & Dossiers -->
        <div class="lg:col-span-1 space-y-6">
            <!-- Formulaire d'upload -->
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <h2 class="text-lg font-semibold mb-4 text-blue-900"><i class="fa-solid fa-cloud-arrow-up mr-2"></i>Ajouter une archive</h2>
                <form id="uploadForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Titre</label>
                        <input type="text" id="archiveTitle" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Dossier / Categorie</label>
                        <select id="archiveFolder" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="Operations">Operations</option>
                            <option value="Administratif">Administratif</option>
                            <option value="Financier">Financier</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Fichier</label>
                        <input type="file" id="archiveFile" required class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    </div>
                    <!-- Barre de progression -->
                    <div id="progressContainer" class="hidden">
                        <div class="w-full bg-gray-200 rounded-full h-2.5">
                            <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
                        </div>
                        <p id="progressText" class="text-xs text-gray-500 mt-1 text-right">0%</p>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition">Enregistrer</button>
                </form>
            </div>
        </div>

        <!-- Panneau de droite : Recherche et Tableau des archives -->
        <div class="lg:col-span-3 space-y-6">
            <!-- Barre de recherche -->
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 flex items-center space-x-4">
                <i class="fa-solid fa-search text-gray-400 ml-2"></i>
                <input type="text" id="searchInput" placeholder="Rechercher par titre, dossier, nom, type, description..." class="w-full focus:outline-none text-gray-700" oninput="filterArchives()">
            </div>

            <!-- Liste / Tableau -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Titre / Fichier</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Dossier</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="archivesTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Les données injectées par Firestore apparaîtront ici -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Scripts Firebase et Logique -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // Configuration Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDTfE06jD2NUS7-l5ynx0Iy-kFtg-8IzPw",
            authDomain: "thc-archivage.firebaseapp.com",
            projectId: "thc-archivage",
            storageBucket: "thc-archivage.firebasestorage.app",
            messagingSenderId: "630363860954",
            appId: "1:630363860954:web:953c7a0e15bfa53b469ae3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let allArchivesData = [];

        window.updateAllSelects = function() {}

        // Gestionnaire d'envoi du formulaire avec barre de progression
        document.getElementById('uploadForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('archiveTitle').value;
            const folder = document.getElementById('archiveFolder').value;
            const fileInput = document.getElementById('archiveFile');
            const file = fileInput.files[0];

            if (!file) return;

            const storageRef = ref(storage, `archives/${folder}/${file.name}`);
            const uploadTask = uploadBytesResumable(storageRef, file);

            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            progressContainer.classList.remove('hidden');

            uploadTask.on('state_changed', 
                (snapshot) => {
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    progressBar.style.width = progress + '%';
                    progressText.innerText = Math.round(progress) + '%';
                }, 
                (error) => {
                    console.error("Erreur d'upload :", error);
                }, 
                () => {
                    getDownloadURL(uploadTask.snapshot.ref).then(async (downloadURL) => {
                        await addDoc(collection(db, "archives"), {
                            title,
                            folder,
                            fileName: file.name,
                            fileSize: file.size,
                            fileType: file.type,
                            fileUrl: downloadURL,
                            createdAt: new Date().toISOString()
                        });
                        progressContainer.classList.add('hidden');
                        document.getElementById('uploadForm').reset();
                    });
                }
            );
        });

        // Fonction globale de rendu du tableau
        window.renderArchives = function(data) {
            const tbody = document.getElementById('archivesTableBody');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">Aucune archive trouvée.</td></tr>`;
                return;
            }

            data.forEach((item) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900">${item.title}</div>
                        <div class="text-sm text-gray-500">${item.fileName || ''}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">${item.folder}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${new Date(item.createdAt).toLocaleDateString()}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <a href="${item.fileUrl}" target="_blank" class="text-blue-600 hover:text-blue-900 mr-3"><i class="fa-solid fa-download"></i></a>
                        <button onclick="deleteArchive('${item.id}')" class="text-red-600 hover:text-red-900"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Suppression d'une archive
        window.deleteArchive = async function(id) {
            if (confirm("Voulez-vous vraiment supprimer cette archive ?")) {
                await deleteDoc(doc(db, "archives", id));
            }
        }

        // Filtrage multicritère optimisé
        window.filterArchives = function() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allArchivesData.filter(item => {
                const matchTitle = item.title?.toLowerCase().includes(query);
                const matchFolder = item.folder?.toLowerCase().includes(query);
                const matchFileName = item.fileName?.toLowerCase().includes(query);
                const matchType = item.fileType?.toLowerCase().includes(query);
                const matchDate = item.createdAt?.toLowerCase().includes(query);
                return matchTitle || matchFolder || matchFileName || matchType || matchDate;
            });

            renderArchives(filtered);
        }

        // Synchronisation temps réel avec Firestore
        onSnapshot(collection(db, "archives"), (snapshot) => {
            allArchivesData = [];
            snapshot.forEach((doc) => {
                allArchivesData.push({ id: doc.id, ...doc.data() });
            });
            
            const loadingText = document.getElementById('loadingText');
            if (loadingText) loadingText.style.display = 'none';

            renderArchives(allArchivesData);
        });

        window.updateAllSelects();
    </script>
</body>
</html>
